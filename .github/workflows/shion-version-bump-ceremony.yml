name: 🚀 Deploying Shion to Production — Annual Version Bump Ceremony

on:
  schedule:
    # Run at both possible UTC times for 09:00 Australia/Sydney on Oct 5
    # (AEST UTC+10 => 23:00 UTC on Oct 4, AEDT UTC+11 => 22:00 UTC on Oct 4)
    - cron: '0 22 4 10 *'
    - cron: '0 23 4 10 *'
  push:
    branches:
      - main

jobs:
  update-age:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SHION_BOT_GITHUB_TOKEN }}

      - name: Calculate age and update README
        id: calc
        run: |
          BIRTH_YEAR=2001
          BIRTH_MMDD="1005"
          TZ_NAME="Australia/Sydney"
          CURRENT_YEAR=$(TZ="$TZ_NAME" date +%Y)
          CURRENT_MMDD=$(TZ="$TZ_NAME" date +%m%d)
          if [ "$CURRENT_MMDD" -ge "$BIRTH_MMDD" ]; then
            NEW_AGE=$((CURRENT_YEAR - BIRTH_YEAR))
          else
            NEW_AGE=$((CURRENT_YEAR - BIRTH_YEAR - 1))
          fi
          echo "age=${NEW_AGE}" >> "$GITHUB_OUTPUT"

          if ! grep -qE "🎂 [0-9]+ years old!" README.md; then
            echo "::error::Age pattern '🎂 N years old!' not found in README.md — did someone manually edit it?"
            exit 1
          fi

          sed -i "s/🎂 [0-9]\+ years old!/🎂 ${NEW_AGE} years old!/" README.md

      - name: Create signed commit via GitHub API, open PR, and self-merge
        env:
          GH_TOKEN: ${{ secrets.SHION_BOT_GITHUB_TOKEN }}
          NEW_AGE: ${{ steps.calc.outputs.age }}
        run: |
          # Nothing to do if README already has the right age
          if git diff --quiet README.md; then
            echo "Age is already up to date. The robots rest."
            exit 0
          fi

          REPO="${GITHUB_REPOSITORY}"
          HEAD_OID=$(git rev-parse HEAD)
          BRANCH="birthday/age-${NEW_AGE}-${GITHUB_RUN_ID}"

          # Create the branch on GitHub (points to current HEAD)
          gh api "repos/${REPO}/git/refs" \
            --method POST \
            --field ref="refs/heads/${BRANCH}" \
            --field sha="${HEAD_OID}"

          # Commits made via the GitHub GraphQL API are automatically marked
          # Verified by GitHub — no GPG key required.
          README_B64=$(base64 -w 0 README.md)
          QUERY='mutation CreateCommit($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }'

          jq -n \
            --arg query  "$QUERY" \
            --arg repo   "$REPO" \
            --arg branch "$BRANCH" \
            --arg msg    "chore: happy birthday! update age to ${NEW_AGE}" \
            --arg oid    "$HEAD_OID" \
            --arg b64    "$README_B64" \
            '{
              query: $query,
              variables: {
                input: {
                  branch:          { repositoryNameWithOwner: $repo, branchName: $branch },
                  message:         { headline: $msg },
                  fileChanges:     { additions: [{ path: "README.md", contents: $b64 }] },
                  expectedHeadOid: $oid
                }
              }
            }' | gh api graphql --input -

          PR_BODY=$(cat <<EOF
          ## 🎂 Another Trip Around the Sun, Delivered!

          Congratulations! You are now officially **${NEW_AGE} years old** — a number certified by the relentless march of time and this very CI pipeline.

          This PR was lovingly generated by a robot that does not age, does not sleep, and has spent the last 365 days doing absolutely nothing except waiting for this exact moment.

          **What changed:**
          - \`README.md\`: Age counter incremented by 1 *(atomic, thread-safe, physically non-negotiable)*

          **What did NOT change:**
          - Your impeccable taste in tech
          - The laws of physics that make birthdays inevitable
          - The fact that computers still do whatever you tell them to

          > "You are ${NEW_AGE}. The CI never forgets. Can your friends say the same? 👀"

          *This PR will self-merge in approximately 1 second. No humans were consulted or harmed in the making of this PR.*
          EOF
          )

          gh pr create \
            --title "🎂 Happy ${NEW_AGE}th Birthday, Shion!" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH"

          sleep 1

          gh pr merge "$BRANCH" --squash --delete-branch
